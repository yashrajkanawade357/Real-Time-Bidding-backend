<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">Browsers connect over WebSockets and HTTP to any number of API instances. Each bid is one Postgres transaction. Postgres notifies every API instance after commit, and each instance pushes the change to its own connected clients.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #e4e0d6; }
      .box { fill: #ffffff; stroke: #d2cdc1; }
      .db { fill: #f3f0e8; stroke: #d2cdc1; }
      .row { fill: #ffffff; stroke: #e4e0d6; }
      .ink { fill: #17160f; } .muted { fill: #827e72; }
      .line { stroke: #17160f; fill: none; }
      .notify { stroke: #7d1f1b; fill: none; } .notify-t { fill: #7d1f1b; }
      .head { fill: #17160f; } .head-n { fill: #7d1f1b; }
      .serif { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #181714; stroke: #2a2924; }
        .box { fill: #1f1e1a; stroke: #3a3832; }
        .db { fill: #13120f; stroke: #3a3832; }
        .row { fill: #1f1e1a; stroke: #2a2924; }
        .ink { fill: #f0eee7; } .muted { fill: #8d897e; }
        .line { stroke: #f0eee7; }
        .notify { stroke: #e2665d; } .notify-t { fill: #e2665d; }
        .head { fill: #f0eee7; } .head-n { fill: #e2665d; }
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head-n" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="429" rx="14"/>

  <text class="sans muted" x="32" y="46" font-size="11.5" font-weight="600" letter-spacing="1">CLIENTS</text>
  <text class="sans muted" x="372" y="46" font-size="11.5" font-weight="600" letter-spacing="1">API INSTANCES · ANY NUMBER</text>
  <text class="sans muted" x="716" y="46" font-size="11.5" font-weight="600" letter-spacing="1">POSTGRESQL · THE ONLY STATE</text>

  <!-- clients -->
  <rect class="box" x="32" y="72" width="200" height="56" rx="8"/>
  <text class="sans ink" x="48" y="96" font-size="14" font-weight="600">Browser</text>
  <text class="mono muted" x="48" y="115" font-size="12">asha</text>
  <rect class="box" x="32" y="148" width="200" height="56" rx="8"/>
  <text class="sans ink" x="48" y="172" font-size="14" font-weight="600">REST client</text>
  <text class="mono muted" x="48" y="191" font-size="12">race_demo.py</text>
  <rect class="box" x="32" y="262" width="200" height="56" rx="8"/>
  <text class="sans ink" x="48" y="286" font-size="14" font-weight="600">Browser</text>
  <text class="mono muted" x="48" y="305" font-size="12">kabir</text>

  <!-- instances -->
  <rect class="box" x="372" y="72" width="216" height="132" rx="10"/>
  <text class="sans ink" x="388" y="98" font-size="15" font-weight="600">Instance 1</text>
  <text class="sans muted" x="388" y="120" font-size="12.5">FastAPI · WebSocket hub</text>
  <text class="sans muted" x="388" y="140" font-size="12.5">holds sockets, never state</text>
  <rect class="box" x="372" y="248" width="216" height="84" rx="10"/>
  <text class="sans ink" x="388" y="274" font-size="15" font-weight="600">Instance 2</text>
  <text class="sans muted" x="388" y="296" font-size="12.5">same code, same database</text>

  <!-- database -->
  <rect class="db" x="716" y="72" width="212" height="260" rx="10"/>
  <rect class="row" x="730" y="88" width="184" height="62" rx="7"/>
  <text class="mono ink" x="744" y="111" font-size="13" font-weight="600">auctions</text>
  <text class="sans muted" x="744" y="131" font-size="12">row locked per bid</text>
  <rect class="row" x="730" y="162" width="184" height="62" rx="7"/>
  <text class="mono ink" x="744" y="185" font-size="13" font-weight="600">bids</text>
  <text class="sans muted" x="744" y="205" font-size="12">append-only, idempotent</text>
  <rect class="row" x="730" y="236" width="184" height="80" rx="7"/>
  <text class="mono ink" x="744" y="259" font-size="13" font-weight="600">auction_events</text>
  <text class="sans muted" x="744" y="279" font-size="12">NOTIFY channel, delivered</text>
  <text class="sans muted" x="744" y="296" font-size="12">only after COMMIT</text>

  <!-- client <-> instance -->
  <line class="line" x1="236" y1="100" x2="368" y2="100" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="mono muted" x="302" y="92" font-size="11.5" text-anchor="middle">WebSocket</text>
  <line class="line" x1="236" y1="176" x2="368" y2="176" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="mono muted" x="302" y="168" font-size="11.5" text-anchor="middle">HTTP</text>
  <line class="line" x1="236" y1="290" x2="368" y2="290" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="mono muted" x="302" y="282" font-size="11.5" text-anchor="middle">WebSocket</text>

  <!-- instance -> db: the transaction -->
  <line class="line" x1="592" y1="112" x2="712" y2="112" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="mono muted" x="652" y="104" font-size="11" text-anchor="middle">1 bid = 1 txn</text>
  <line class="line" x1="592" y1="270" x2="712" y2="270" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="mono muted" x="652" y="262" font-size="11" text-anchor="middle">1 bid = 1 txn</text>

  <!-- db -> instances: notify -->
  <path class="notify" d="M712 176 H596" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#n)"/>
  <text class="mono notify-t" x="652" y="168" font-size="11" text-anchor="middle">NOTIFY</text>
  <path class="notify" d="M712 312 H596" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#n)"/>
  <text class="mono notify-t" x="652" y="304" font-size="11" text-anchor="middle">NOTIFY</text>

  <text class="sans ink" x="32" y="372" font-size="13.5">A bid placed through instance 1 reaches kabir on instance 2: every instance LISTENs, and Postgres tells them all after the commit.</text>
  <text class="sans muted" x="32" y="396" font-size="13">No sticky sessions, no broker, no state in memory. A client can reconnect to any instance and gets a snapshot read from the database.</text>
</svg>
