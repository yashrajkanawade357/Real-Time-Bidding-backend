<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">How the row lock orders three simultaneous bids</title>
  <desc id="d">Three bids arrive at the same time while the price is 1,000 with an increment of 50. They queue on the auction row lock. 1,050 is accepted, then 1,200 is accepted, then 1,100 is rejected because it is now below the minimum of 1,250. Without the lock all three read 1,000, all pass, and the last write wins.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #e4e0d6; }
      .ink { fill: #17160f; } .muted { fill: #827e72; } .faint { stroke: #e4e0d6; }
      .hold { fill: #17160f; } .hold-t { fill: #fbfaf6; }
      .wait { fill: url(#hatch); stroke: #d2cdc1; }
      .hatch-line { stroke: #d2cdc1; }
      .ok { fill: #17663f; } .ok-bg { fill: #e3f0e7; }
      .no { fill: #b0281c; } .no-bg { fill: #fbe6e2; }
      .no-stroke { stroke: #b0281c; }
      .axis { stroke: #b0ab9f; }
      .serif { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          </style>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatch-line" x1="0" y1="0" x2="0" y2="7" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="muted" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="539" rx="14"/>

  <text class="serif ink" x="32" y="48" font-size="24">Three bids land in the same millisecond</text>
  <text class="sans muted" x="32" y="74" font-size="13.5">Price is ₹1,000, increment ₹50. Each bid is one transaction that begins with <tspan class="mono" font-size="12.5">SELECT … FOR UPDATE</tspan> on the auction row.</text>

  <!-- axis -->
  <line class="axis" x1="210" y1="104" x2="728" y2="104" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="sans muted" x="210" y="96" font-size="11.5">all arrive</text>
  <text class="sans muted" x="728" y="96" font-size="11.5" text-anchor="end">time</text>
  <text class="sans muted" x="752" y="96" font-size="11.5" letter-spacing="1">RESULT</text>

  <!-- lane A: 1,050 gets the lock first -->
  <text class="sans ink" x="32" y="140" font-size="14" font-weight="600">Bid ₹1,050</text>
  <text class="sans muted" x="32" y="158" font-size="12">first to the lock</text>
  <rect class="hold" x="210" y="124" width="172" height="40" rx="6"/>
  <text class="mono hold-t" x="222" y="149" font-size="12.5">needs ≥ ₹1,000  ✓</text>
  <rect class="ok-bg" x="752" y="124" width="176" height="40" rx="6"/>
  <text class="sans ok" x="766" y="141" font-size="12.5" font-weight="600">Accepted</text>
  <text class="mono ok" x="766" y="157" font-size="12">price → ₹1,050</text>

  <!-- lane B: 1,200 waits, then wins -->
  <text class="sans ink" x="32" y="208" font-size="14" font-weight="600">Bid ₹1,200</text>
  <text class="sans muted" x="32" y="226" font-size="12">waits for A</text>
  <rect class="wait" x="210" y="192" width="172" height="40" rx="6"/>
  <text class="sans muted" x="222" y="217" font-size="12">waiting for the lock</text>
  <rect class="hold" x="386" y="192" width="172" height="40" rx="6"/>
  <text class="mono hold-t" x="398" y="217" font-size="12.5">needs ≥ ₹1,100  ✓</text>
  <rect class="ok-bg" x="752" y="192" width="176" height="40" rx="6"/>
  <text class="sans ok" x="766" y="209" font-size="12.5" font-weight="600">Accepted</text>
  <text class="mono ok" x="766" y="225" font-size="12">price → ₹1,200</text>

  <!-- lane C: 1,100 waits for both, then is too low -->
  <text class="sans ink" x="32" y="276" font-size="14" font-weight="600">Bid ₹1,100</text>
  <text class="sans muted" x="32" y="294" font-size="12">waits for A and B</text>
  <rect class="wait" x="210" y="260" width="348" height="40" rx="6"/>
  <text class="sans muted" x="222" y="285" font-size="12">waiting for the lock</text>
  <rect class="hold" x="562" y="260" width="172" height="40" rx="6"/>
  <text class="mono hold-t" x="574" y="285" font-size="12.5">needs ≥ ₹1,250  ✗</text>
  <rect class="no-bg" x="752" y="260" width="176" height="40" rx="6"/>
  <text class="sans no" x="766" y="277" font-size="12.5" font-weight="600">Rejected</text>
  <text class="mono no" x="766" y="293" font-size="12">bid_too_low</text>

  <text class="sans ink" x="32" y="336" font-size="13.5">Final price <tspan font-weight="600">₹1,200</tspan>. Shuffle the arrival order any way you like and it is still ₹1,200.</text>
  <text class="sans muted" x="32" y="356" font-size="13.5">Each bid is judged against the committed price while it holds the lock, never against what its sender last saw.</text>

  <line class="faint" x1="32" y1="382" x2="928" y2="382" stroke-width="1"/>

  <!-- without the lock -->
  <text class="sans no" x="32" y="412" font-size="11.5" font-weight="600" letter-spacing="1">WITHOUT THE LOCK</text>
  <text class="sans ink" x="32" y="436" font-size="13.5">Read, check, write. All three read ₹1,000, all three pass the check, and whichever write lands last wins.</text>
  <g class="mono" font-size="12">
    <rect class="no-bg" x="32" y="454" width="268" height="34" rx="6"/>
    <text class="ink" x="44" y="476">read 1,000 ✓ → write 1,050</text>
    <rect class="no-bg" x="312" y="454" width="268" height="34" rx="6"/>
    <text class="ink" x="324" y="476">read 1,000 ✓ → write 1,200</text>
    <rect class="no-bg" x="592" y="454" width="336" height="34" rx="6"/>
    <text class="ink" x="604" y="476">read 1,000 ✓ → write 1,100  <tspan class="no" font-weight="600">← lands last</tspan></text>
  </g>
  <text class="sans no" x="32" y="516" font-size="13.5" font-weight="600">Final price ₹1,100. The ₹1,200 bidder was told they were winning, and lost.</text>
</svg>
