name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bidding_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Tests (real Postgres)
        run: pytest -q

      - name: Race demo against a live server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bidding_test
          ENABLE_UNSAFE_DEMO: "false"
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          python scripts/race_demo.py --bids 300
          python scripts/reconnect_demo.py

  # Boots exactly what the EC2 instance runs (deploy/on-boot.sh minus git pull):
  # nginx in front of two API instances, nothing else published, secrets from .env.
  aws-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f docker-compose.yml -f deploy/docker-compose.aws.yml
      BIDDING_ADMIN_KEY: ci-admin-key-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v5

      - name: Secrets the server would generate for itself
        run: |
          printf 'POSTGRES_PASSWORD=%s\nADMIN_KEY=%s\nTRUSTED_PROXY_HOPS=1\n' \
            "ci-$(openssl rand -hex 12)" "$BIDDING_ADMIN_KEY" > .env

      - name: Start the stack
        run: $COMPOSE up -d --build

      - name: Wait until it answers through nginx
        run: |
          for i in $(seq 1 60); do curl -sf localhost/health && exit 0; sleep 2; done
          exit 1

      - name: nginx spreads requests across both instances
        run: |
          # The second instance may still be starting; nginx then routes around it briefly.
          for attempt in $(seq 1 30); do
            seen=$(for i in $(seq 1 8); do curl -s localhost/health | jq -r '.instance // empty'; done | sort -u | tr '\n' ' ')
            echo "instances seen: $seen"
            if [ "$seen" = "instance-1 instance-2 " ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - name: Reconnect walkthrough through nginx (lot opened via the admin API)
        run: python scripts/reconnect_demo.py --base-url http://localhost

      - name: Only port 80 is published
        run: |
          for port in 5432 8000 8001; do
            if nc -z -w 2 localhost $port; then echo "port $port is open"; exit 1; fi
          done

      - name: Public endpoints are locked down
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST localhost/auctions/1/bids/unsafe -H 'content-type: application/json' -d '{"bidder":"ci","amount":1}')" = 404
          test "$(code -X POST localhost/auctions -H 'content-type: application/json' -d '{"title":"x","starting_price":1}')" = 403
          test "$(code localhost/admin/api/overview -H 'Authorization: Bearer wrong-key-0123456789abcdefgh')" = 401
          test "$(code localhost/admin/api/overview -H "Authorization: Bearer $BIDDING_ADMIN_KEY")" = 200
          judge=$(curl -s localhost/config | jq -r .judge_key)
          test ${#judge} -ge 32
          test "$(code localhost/admin/api/overview -H "Authorization: Bearer $judge")" = 200
          test "$(code -X POST localhost/admin/api/judge-key/rotate -H "Authorization: Bearer $judge")" = 403
          curl -sI localhost/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -sI localhost/ | grep -qi "^x-frame-options: DENY"
          ! curl -sI localhost/ | grep -qi "^server: uvicorn"

      - name: Container logs
        if: failure()
        run: $COMPOSE logs
