name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bidding_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests (real Postgres)
        run: pytest -q

      - name: Race demo against a live server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bidding_test
          ENABLE_UNSAFE_DEMO: "false"
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          python scripts/race_demo.py --bids 300
          python scripts/reconnect_demo.py

  # Boots exactly what an EC2 instance runs (deploy/ec2-user-data.sh minus the
  # git clone) and checks it from the outside.
  aws-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Start Postgres + two API instances with the AWS overrides
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.aws.yml up -d --build

      - name: Wait until both instances are healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost/health && curl -sf localhost:8001/health; then exit 0; fi
            sleep 2
          done
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - name: Reconnect walkthrough against port 80
        run: python scripts/reconnect_demo.py --base-url http://localhost

      - name: Database is not reachable from outside
        run: "! nc -z -w 2 localhost 5432"

      - name: Unsafe demo endpoint is off
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost/auctions/1/bids/unsafe \
            -H 'content-type: application/json' -d '{"bidder": "ci", "amount": 1}')
          test "$code" = 404

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.aws.yml logs
