# Load balancer for the public server: spreads requests and WebSockets across
# both API instances. No sticky sessions - any instance can serve any client,
# because state lives in Postgres and every instance hears every event.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        server api:8000;
        server api-2:8000;
    }

    server {
        listen 80 default_server;
        client_max_body_size 16k;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Appends the address nginx received the request from (CloudFront's edge).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
